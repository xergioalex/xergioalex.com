# Generated by devcontainer-kit (`dck init`) from .devcontainer/dck.toml.
# Blocks between ">>> dck:" and "<<< dck:" markers are reconciled by `dck init`;
# everything outside them is yours (add backing services after the marked block).
# >>> dck:project >>>
name: xergioalex-com
# <<< dck:project <<<

services:
  # >>> dck:service >>>
  xergioalexcom:
    build:
      context: ./xergioalexcom
      dockerfile: Dockerfile
      args:
        # The coding-agent CLIs installed in YOUR image: dck.toml [agents] clis,
        # unless you set DCK_AGENT_CLIS (docker/local/.env, the shell, or your host
        # profile's [agents] clis / clis_extra through dck up), plus each
        # INSTALL_<CLI>_CLI=true. Then `dck rebuild`. Every supported CLI is wired.
        DCK_AGENT_CLIS: "${DCK_AGENT_CLIS:-claude codex cursor opencode pi cline grok}"
        INSTALL_CLAUDE_CLI: "${INSTALL_CLAUDE_CLI:-false}"
        INSTALL_CODEX_CLI: "${INSTALL_CODEX_CLI:-false}"
        INSTALL_CURSOR_CLI: "${INSTALL_CURSOR_CLI:-false}"
        INSTALL_OPENCODE_CLI: "${INSTALL_OPENCODE_CLI:-false}"
        INSTALL_PI_CLI: "${INSTALL_PI_CLI:-false}"
        INSTALL_CLINE_CLI: "${INSTALL_CLINE_CLI:-false}"
        INSTALL_GROK_CLI: "${INSTALL_GROK_CLI:-false}"
    init: true
    working_dir: /app
    command: ["sleep", "infinity"]
    volumes:
      - ../..:/app:cached
      # Per-project named volumes (compose prefixes them with the project name).
      - state:/home/node/.dck/volumes/state
      - agentkit:/home/node/.dck/volumes/agentkit
      - claude:/home/node/.dck/volumes/claude
      - codex:/home/node/.dck/volumes/codex
      - cursor:/home/node/.dck/volumes/cursor
      - opencode:/home/node/.dck/volumes/opencode
      - pi:/home/node/.dck/volumes/pi
      - cline:/home/node/.dck/volumes/cline
      - grok:/home/node/.dck/volumes/grok
      # The host's SSH agent (git over SSH, signing) — never a key file. Docker
      # Desktop exposes it at this path; on a Linux host set DCK_HOST_SSH_AUTH_SOCK
      # (dck up and dck rebuild do it from $SSH_AUTH_SOCK). A missing host path
      # fails the start instead of being created.
      - type: bind
        source: ${DCK_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}
        target: /run/dck/ssh-agent.sock
        bind:
          create_host_path: false
    ports:
      # Loopback only unless dck.toml sets `bind`.
      - "127.0.0.1:22029:22"   # sshd (Herdr, `dck ssh`)
      - "127.0.0.1:4444:4444"   # web
    env_file:
      - path: ./xergioalexcom/.env
        required: false
    environment:
      DCK_USER: node
      DCK_WORKSPACE: /app
      DCK_SSH: "1"
      DCK_EDITOR: "1"
      SSH_AUTH_SOCK: /run/dck/ssh-agent.sock
      # Agents layer: one named volume per supported CLI's home, installed or
      # not (persisted by the entrypoint); ak profiles live on the agentkit
      # volume. Every agent launched through ak runs in autonomy (this container
      # is the sandbox). Opt-out — agents ask before acting:
      # set AGENTKIT_PERMISSIONS=ask in ./xergioalexcom/.env (this block is
      # reconciled by `dck init`; the .env is yours).
      DCK_AGENTS: "claude codex cursor opencode pi cline grok"
      AGENTKIT_PROFILES_DIR: /home/node/.dck/volumes/agentkit/profiles
      DCK_DAILYBOT: "1"
      # Public key(s) dck authorizes for sshd; set by `dck up`, empty otherwise.
      DCK_AUTHORIZED_KEYS: "${DCK_AUTHORIZED_KEYS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # <<< dck:service <<<

  # Playwright MCP server (isolated container, SSE transport). The official
  # Playwright image ships the browsers' system deps, so the dev container stays
  # slim. The dev container reaches it by service name over the compose network:
  # http://playwright-mcp:8931/sse (see .mcp.json and .cursor/mcp.json). SSE,
  # not streamable HTTP (/mcp): the client's Accept header triggers a 406 there.
  # --allowed-hosts: the server only accepts Host: localhost by default.
  # @playwright/mcp pins an alpha playwright build whose Chromium revision
  # differs from the image's, so the exact browser is installed on first boot
  # and cached under tmp/ (git-ignored), reused by later recreates.
  # --output-dir: screenshots/snapshots land in /app/tmp/screenshots.
  playwright-mcp:
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    init: true
    command:
      - /bin/sh
      - -c
      - "npx -y @playwright/mcp@0.0.76 install-browser chrome-for-testing && npx -y @playwright/mcp@0.0.76 --headless --isolated --no-sandbox --browser chromium --host 0.0.0.0 --port 8931 --allowed-hosts playwright-mcp:8931,localhost:8931 --output-dir /app/tmp/screenshots"
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /app/tmp/.playwright-browsers
    volumes:
      - ../..:/app
    ports:
      # Only needed to reach the MCP from the host; loopback only.
      - "127.0.0.1:8931:8931"

  # End-to-end test runner (Playwright Test), on demand only (profile "e2e"),
  # so it never starts with `up`. Same pinned image as the MCP. By default the
  # Playwright config builds the site and runs `astro preview` itself. See
  # tests/e2e/README.md. Run from the host:
  #   docker compose -f docker/local/docker-compose.yaml --profile e2e run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    init: true
    working_dir: /app
    profiles: ["e2e"]
    environment:
      - CI=true
    volumes:
      - ../..:/app
      # Isolate node_modules from the dev container (different base image);
      # kept under tmp/ (git-ignored) so repeated runs do not reinstall.
      - ../../tmp/.e2e-node-modules:/app/node_modules
    command:
      - /bin/sh
      - -c
      - "corepack enable && pnpm install && pnpm run test:e2e"

# >>> dck:volumes >>>
volumes:
  state: {}
  agentkit: {}
  claude: {}
  codex: {}
  cursor: {}
  opencode: {}
  pi: {}
  cline: {}
  grok: {}
# <<< dck:volumes <<<
